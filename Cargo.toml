[package]
name = "nix-log-diff-analyzer"
version = "0.1.0"
edition = "2024"
description = "Ask a local LLM (ollama or llama.cpp) whether a diff of two sorted Nix build logs is noise or consequential"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
env_logger = "0.11.11"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
