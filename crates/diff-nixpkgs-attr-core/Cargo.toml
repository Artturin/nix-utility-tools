[package]
name = "diff-nixpkgs-attr-core"
version.workspace = true
edition.workspace = true
description = "Compare nixpkgs attributes between a base revision and the working tree: evaluate, build both sides, diff build logs and outputs"

[dependencies]
anyhow = "1.0.104"
difflog = { path = "../difflog" }
diffoscope-nix = { path = "../diffoscope-nix" }
nix-utility-common = { path = "../nix-utility-common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2"
which = "8.0.6"
