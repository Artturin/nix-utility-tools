[package]
name = "diff-nixpkgs-attr"
version.workspace = true
edition.workspace = true
description = "Compare nixpkgs attributes between a base revision and the working tree with difflog and diffoscope-nix"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
diff-nixpkgs-attr-core = { path = "../diff-nixpkgs-attr-core" }
env_logger = "0.11.11"
log = "0.4.35"
shell-words = "1.1.1"

[dev-dependencies]
tempfile = "3.27.0"
